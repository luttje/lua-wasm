<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lua Web Assembly &bull; Demo</title>
</head>
<body>
  <header>
    <h1>
      Lua Web Assembly &bull; Demo
    </h1>
    <img src="assets/Lua-Logo_128.png" alt="">
    <img src="assets/WebAssembly-Logo_128.png" alt="">
  </header>

  <section>
    <h2>Lua code</h2>
    <p><label for="input">Enter Lua source-code you wish to execute:</label></p>
<textarea id="input" rows="16" cols="80">
print(_VERSION)
return "ok"
</textarea>
<div>
  <button id="run" type="button" disabled>Run code</button>
</div>
  </section>

  <section>
    <h2>Output</h2>
    <textarea id="output" rows="8" cols="80" readonly></textarea>
    <div id="status">&#8986; Loading Lua ...</div>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
