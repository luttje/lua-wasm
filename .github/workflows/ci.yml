name: Build distribution

on: [push, pull_request]

jobs:
  build:
    name: Build Lua ${{ matrix.lua }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lua: ['5.1.5', '5.2.4', '5.3.6', '5.4.8', 'latest']

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      -
        name: Install and setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      -
        name: Build Lua to WebAssembly
        run: node build.mjs --lua ${{ matrix.lua }}
      -
        name: Test the build
        run: node --test
      -
        name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: liblua-${{ matrix.lua }}
          path: dist/

  # The demo on GitHub Pages only follows main, never branches or pull requests
  deploy:
    name: Publish demo to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      -
        name: Download the build of the latest Lua version
        uses: actions/download-artifact@v8
        with:
          name: liblua-latest
          path: dist/
      -
        name: Publish to GitHub pages
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: gh-pages
          build_dir: dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
